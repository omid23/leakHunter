name: Scheduled model evals

on:
  schedule:
    - cron: "17 3 * * *"  # nightly, 03:17 UTC
  workflow_dispatch:
    inputs:
      repeats:
        description: Repeats per case
        default: "3"
      model:
        description: Model id (e.g. claude-opus-5-5, or claude-haiku-5-5 for a cheaper run)
        default: claude-opus-5-5

jobs:
  anthropic-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LEAKHUNTER_MODEL: ${{ inputs.model || 'claude-opus-5-5' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Full dataset against the real model (thresholds enforced)
        id: evals
        run: python -m evals --client anthropic --repeats ${{ inputs.repeats || 3 }} --out reports/evals/anthropic-latest
      - name: Diff against the last committed report (drift detection)
        if: always()
        run: python -m evals.compare reports/evals/anthropic/report.json reports/evals/anthropic-latest/report.json
      - name: Live smoke test
        if: always()
        run: pytest -m anthropic tests/integration/test_anthropic_live.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anthropic-eval-report
          path: reports/evals/anthropic-latest/
