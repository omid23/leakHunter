[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leakhunter"
version = "0.1.0"
description = "Cloud cost remediation agent: explains AWS bill spikes and proposes approved, mocked remediation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "anthropic>=0.40",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "pytest-playwright>=0.5",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["leakhunter*", "evals*"]

[tool.setuptools.package-data]
leakhunter = ["data/fixtures/*", "api/static/*"]
evals = ["dataset.json"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
packages = ["leakhunter", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "browser: Playwright browser tests (need Chromium)",
    "evals: executable AI evaluation tests",
    "anthropic: tests that call the real Anthropic API (skipped without a key)",
]
addopts = "-ra"
